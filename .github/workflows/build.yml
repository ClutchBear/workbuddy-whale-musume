name: 构建 Windows 可执行文件

# 触发条件：
#   · 推 tag（如 v0.3.0）  → 编译 + 打包 + 发布 Release（zip 作为附件，可直接下载）
#   · 推 main / 手动触发    → 编译 + 打包 + 存为 Actions artifact
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# gh release create 需要仓库写权限
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # 交付的 exe 名。故意不叫 workbuddy-pet.exe —— WorkBuddy 主程序会按进程名强杀同名进程
  BIN_NAME: wb-pet.exe
  # 要打进 zip 根目录的附加文件（许可声明、使用说明）放这里，整目录复制
  DIST_EXTRA: .github/dist-extra

# ─────────────────────────────────────────────────────────────────────────────
# 维护须知（踩过的坑，改这个文件前先读）：
#
# 1) 所有 run 块的正文一律保持纯 ASCII（英文），中文说明写在 YAML 注释里。
#    Windows PowerShell 会把「无 BOM 的 UTF-8 脚本」按本地代码页（GBK）解码，
#    正文里一旦出现中文，字节被误解后可能打断语法解析（实测报
#    「字符串缺少终止符」「，“后面缺少表达式」）。shell: pwsh（PS 7）默认按 UTF-8
#    读，本身没问题，但同一段命令复制到 PS 5.1 里跑就会炸 —— 所以正文不写中文。
#
# 2) 往 GITHUB_ENV 写入一律用 [System.IO.File]::AppendAllText + UTF8Encoding($false)，
#    不要用 >>。PS 5.1 的 >> 默认编码是 UTF-16LE，后续步骤读到的键名会变成空字符
#    （实测报「该字符串的首字符为空字符」）。PS 7 的 >> 是 UTF-8 无 BOM（正常），
#    但显式写就不挑版本。
#
# 3) 步骤之间不传中间变量（如 ZIP）。需要的东西从 label / BIN_NAME 推导，少一处编码坑。
#
# 4) zip 条目名必须用正斜杠（见「打包 zip」步骤注释）。
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  build:
    name: 编译并打包
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust（MSVC 目标）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: 缓存 cargo registry 与 target
        # 也可以换成 Swatinem/rust-cache@v2（第三方，会自动裁剪 target、缓存键更准）
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: 读版本号
        # 推 tag 时用 tag 名（v0.3.0），否则用 Cargo.toml 的 version
        # 写 GITHUB_ENV 用显式 UTF-8 无 BOM，而不是 >>
        #   —— PowerShell 5.1 的 >> 默认写 UTF-16LE，会让后续步骤读到的键名变空字符
        #   —— PowerShell 7 的 >> 是 UTF-8 无 BOM（正常），但显式写就不挑版本了
        shell: pwsh
        run: |
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          $v = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ('${{ github.ref_type }}' -eq 'tag') { $label = '${{ github.ref_name }}' } else { $label = "v$v" }
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "version=$v`n", $utf8)
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "label=$label`n", $utf8)
          Write-Host "Cargo version=$v  label=$label"

      - name: 编译（release）
        run: cargo build --release --locked

      - name: 组装运行目录
        # 先清空 dist：它是运行目录，本地可能残留 whale-state.json（含用户城市名）
        # 和 *.log 等运行期产物，绝不能混进对外发布的包
        shell: pwsh
        run: |
          Remove-Item dist -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force dist | Out-Null

          Copy-Item "target\release\workbuddy-pet.exe" "dist\$env:BIN_NAME" -Force
          Copy-Item -Recurse -Force assets dist\assets
          Copy-Item LICENSE, LICENSE-upstream, THIRD-PARTY-LICENSES.md dist\ -Force
          Copy-Item "$env:DIST_EXTRA\*" dist\ -Recurse -Force

          Write-Host "---- dist ----"
          Get-ChildItem dist | ForEach-Object {
            if ($_.PSIsContainer) { Write-Host ("  {0,-24} <dir>" -f $_.Name) }
            else { Write-Host ("  {0,-24} {1,10:N0} B" -f $_.Name, $_.Length) }
          }

      - name: 冒烟检查
        # exe 体积、立绘/emoji 数量、许可声明齐全；并拦截运行期产物混入
        shell: pwsh
        run: |
          $exe = "dist\$env:BIN_NAME"
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          $mb = (Get-Item $exe).Length / 1MB
          Write-Host ("exe size {0:N2} MB" -f $mb)
          if ($mb -lt 0.5 -or $mb -gt 10) { throw ("exe size looks wrong: {0:N2} MB" -f $mb) }

          $webp  = (Get-ChildItem dist\assets\*.webp).Count
          $emoji = (Get-ChildItem dist\assets\emoji\*.png).Count
          Write-Host "artwork=$webp  emoji=$emoji"
          if ($webp  -lt 80)  { throw "too few artwork files: $webp" }
          if ($emoji -lt 200) { throw "too few emoji files: $emoji" }
          if (-not (Test-Path dist\LICENSE)) { throw "LICENSE missing from dist" }

          $leak = Get-ChildItem dist -Recurse -File |
                  Where-Object { $_.Name -like '*.log' -or $_.Name -like 'whale-state.json' -or $_.Name -like '*.db' }
          if ($leak) { throw ("runtime file leaked into dist: " + ($leak.FullName -join ', ')) }

      - name: 打包 zip
        # 手写 zip 条目，不用 Compress-Archive：
        #   条目名必须用正斜杠（ZIP APPNOTE 规范）。用反斜杠时，部分解压工具会把
        #   "assets\foo.webp" 当成一个平铺的文件名，目录结构整个丢失。
        #   只写文件条目、不写目录条目，解压工具会按路径自动建目录。
        shell: pwsh
        run: |
          $zipName = "workbuddy-whale-musume-$env:label-win64.zip"
          $zipPath = Join-Path (Get-Location).Path $zipName
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }

          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $root = (Resolve-Path dist).Path.TrimEnd('\')

          $fs  = [System.IO.File]::Create($zipPath)
          $arc = New-Object System.IO.Compression.ZipArchive($fs, [System.IO.Compression.ZipArchiveMode]::Create)
          $n = 0
          foreach ($f in Get-ChildItem dist -Recurse -File) {
            $rel = $f.FullName.Substring($root.Length + 1).Replace('\', '/')
            $entry = $arc.CreateEntry($rel, [System.IO.Compression.CompressionLevel]::Optimal)
            $os = $entry.Open()
            $is = [System.IO.File]::OpenRead($f.FullName)
            try { $is.CopyTo($os) } finally { $is.Dispose(); $os.Dispose() }
            $n++
          }
          $arc.Dispose(); $fs.Dispose()

          Write-Host ("zip entries={0}  size={1:N2} MB" -f $n, ((Get-Item $zipPath).Length / 1MB))

      - name: 核对 zip 内容
        # 断言：条目名不含反斜杠、根目录有 exe 与 LICENSE、assets/ 结构完整
        # zip 名由 label 推导（不在步骤间传 ZIP 变量，少一处编码坑）
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = "workbuddy-whale-musume-$env:label-win64.zip"
          $z = [System.IO.Compression.ZipFile]::OpenRead((Join-Path (Get-Location).Path $zip))

          Write-Host "entries=$($z.Entries.Count)"
          $z.Entries | Where-Object { $_.FullName -notlike 'assets/*' } |
            Select-Object FullName, Length | Format-Table -AutoSize

          $back = @($z.Entries | Where-Object { $_.FullName.Contains('\') })
          if ($back.Count -gt 0) { throw ("zip entry uses backslash: " + $back[0].FullName) }

          $names = @($z.Entries | ForEach-Object { $_.FullName })
          if ($names -notcontains $env:BIN_NAME) { throw "zip root missing $env:BIN_NAME" }
          if ($names -notcontains 'LICENSE')     { throw "zip root missing LICENSE" }
          $webpInZip = @($names | Where-Object { $_ -like 'assets/*.webp' }).Count
          if ($webpInZip -lt 80) { throw "too few webp in zip: $webpInZip" }
          Write-Host "zip content OK (webp=$webpInZip)"
          $z.Dispose()

      - name: 上传为 artifact
        uses: actions/upload-artifact@v4
        with:
          name: workbuddy-whale-musume-${{ env.label }}-win64
          path: workbuddy-whale-musume-${{ env.label }}-win64.zip
          if-no-files-found: error
          retention-days: 90

      - name: 发布 Release（仅 tag）
        # 已有同名 Release 时只覆盖附件，不重建
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $zip = "workbuddy-whale-musume-$env:label-win64.zip"
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "release $tag exists, uploading with --clobber"
            gh release upload $tag $zip --clobber
          } else {
            gh release create $tag $zip `
              --title "workbuddy-whale-musume $tag" `
              --notes-file .github/release-notes.md
          }
